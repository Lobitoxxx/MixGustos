services:
  db:
    image: postgres:16-alpine
    container_name: mixgustos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mixgustos
      POSTGRES_PASSWORD: mixgustos_dev
      POSTGRES_DB: mixgustos
    ports:
      - "5432:5432"
    volumes:
      - mixgustos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mixgustos -d mixgustos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mixgustos_pgdata:
